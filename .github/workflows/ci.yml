name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      # --ignore-scripts skips Playwright's browser download: the .cjs unit
      # tests don't launch a browser, and the download is ~400MB per run.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Whitespace check
        run: git diff --check
